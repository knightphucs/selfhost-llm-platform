# Hạ tầng lưu trữ chạy trên Mac: PostgreSQL 16 + pgvector.
# Chạy: docker compose -f deploy/docker-compose.yml up -d
name: selfhostllm

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: selfhostllm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selfhostllm}
      POSTGRES_USER: ${POSTGRES_USER:-selfhostllm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-selfhostllm_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chỉ chạy khi volume trống (lần khởi tạo đầu tiên).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
